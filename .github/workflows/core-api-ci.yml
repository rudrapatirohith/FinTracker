name: Core API CI

on:
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"

permissions:
  contents: read

jobs:
  core-api:
    name: Core API tests (Java 21 / PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/core-api/pom.xml

      - name: Make Maven wrapper executable
        working-directory: services/core-api
        run: chmod +x ./mvnw

      - name: Run backend verification
        working-directory: services/core-api
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
