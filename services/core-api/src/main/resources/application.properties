
# Load the shared root environment file
spring.config.import=optional:file:../../.env[.properties]

# Application
spring.application.name=fintracker-core-api

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT security
fintracker.security.jwt.secret=${JWT_SECRET}
fintracker.security.jwt.issuer=fintracker-core-api
fintracker.security.jwt.access-token-ttl=PT15M

# Refresh token and persistent session
fintracker.security.refresh-token.ttl=P30D
fintracker.security.refresh-token.cookie-name=fintracker_refresh_token
# IMPORTANT: Set REFRESH_COOKIE_SECURE=true in production, where HTTPS is mandatory.
fintracker.security.refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:false} 

# Google OAuth 2.0 / OpenID Connect
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Google OIDC provider
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# OAuth login handoff
fintracker.security.oauth.handoff-ttl=PT1M

# Frontend OAuth callback
fintracker.security.oauth.frontend-callback-url=${FRONTEND_OAUTH_CALLBACK_URL}

# Frontend origin allowed to call the API
fintracker.security.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
